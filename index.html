<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="바디루틴 인바디 운동 플래너의 웹 앱 파일을 다운로드하세요.">
  <title>바디루틴 다운로드</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, "Malgun Gothic", sans-serif; color: #172823; background: #eef3ef; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; }
    main { width: min(100%, 36rem); padding: clamp(1.6rem, 6vw, 3.5rem); background: #fff; border: 1px solid #dce7df; border-radius: 1.5rem; box-shadow: 0 16px 48px #17432912; }
    h1 { margin: 0; font-size: clamp(1.8rem, 5.5vw, 2.9rem); line-height: 1.2; letter-spacing: -0.05em; }
    p { margin: 1rem 0 0; color: #4a5b54; line-height: 1.7; word-break: keep-all; }
    a { display: inline-block; margin-top: 1.6rem; border-radius: 0.7rem; background: #205942; color: #fff; text-decoration: none; font-weight: 700; padding: 0.85rem 1.2rem; }
    a:hover { background: #174631; }
    a:focus-visible { outline: 3px solid #205942; outline-offset: 4px; }
    .hint { font-size: 0.9rem; }
    code { color: #254735; }
  </style>
</head>
<body>
  <main>
    <h1>바디루틴 다운로드</h1>

    <a href="./bodyroutine-planner.zip" download>ZIP 다운로드</a>
    <p class="hint">압축을 푼 뒤 <code>README.md</code>의 실행 방법을 따라주세요.</p>
  </main>
</body>
</html>
